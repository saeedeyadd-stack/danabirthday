<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Dana - Forever</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Tahoma', sans-serif;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .audio-control {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(255, 105, 180, 0.4);
            border: 2px solid #ff69b4;
            color: #fff;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 16px;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(255, 105, 180, 0.5);
        }
        .audio-control:hover {
            background: rgba(255, 105, 180, 0.8);
        }
        #poetry-overlay {
            position: fixed;
            bottom: 40px;
            width: 100%;
            text-align: center;
            z-index: 1000;
            color: #ffb6c1;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 0 0 12px rgba(255, 105, 180, 0.9);
            padding: 0 20px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <button class="audio-control" id="audioBtn" onclick="toggleAudio()">🎵 تشغيل الأغنية والشعر</button>
    <!-- الشعر مترجم ومصاغ باللغة العربية الفصحى -->
    <div id="poetry-overlay">أريد أن أعرف لماذ أحببتك بكل ما أملك... يدك وهي تلمسني تشعرني بسكينة تعلو فوق القمر<br>تعالي وانظري إلى جمال القمر الذي يطل بسلامه ويهدينا أوقاتنا</div>
    <div id="canvas-container"></div>

    <audio id="bgAudio" loop>
        <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf7f6.mp3?filename=romantic-guitars-112134.mp3" type="audio/mpeg">
    </audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <script>
        let audioPlaying = false;
        function toggleAudio() {
            const audio = document.getElementById('bgAudio');
            const btn = document.getElementById('audioBtn');
            const poetry = document.getElementById('poetry-overlay');
            
            if (!audioPlaying) {
                audio.play().then(() => {
                    audioPlaying = true;
                    btn.innerText = "🔇 إيقاف الأغنية والشعر";
                    poetry.style.opacity = "1";
                }).catch(e => console.log(e));
            } else {
                audio.pause();
                audioPlaying = false;
                btn.innerText = "🎵 تشغيل الأغنية والشعر";
                poetry.style.opacity = "0";
            }
        }

        // مسارات الصور العشرة الحقيقية
        const imagesList = [
            "f28844b1-0afb-4535-a182-cad2828bdc92.JPG",
            "06f1bcbd-c0b3-46b2-b53b-7b02e831fdef.JPG",
            "6fd4fe2d-4034-42af-af57-4b94ce0227f3.JPG",
            "7dbe8e0e-3a0b-4cdf-a2d5-fa5506c43c6f.JPG",
            "858da677-f1e2-4f72-a5a9-24db9021dddd.jpg",
            "1553f355-c38b-43f2-8a55-554f5f6d604e.JPG",
            "09675e7f-9263-423d-a829-d228fbd03b98.jpg",
            "86583b75-c6ae-4750-a128-cde9e47de2c8.JPG",
            "435497b1-f34c-4dbf-8282-de196f1e4b02.jpg",
            "dfe152a0-a536-4f93-8dbf-501c5505cd83.JPG"
        ];

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 15;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 1);
        scene.add(ambientLight);

        const textureLoader = new THREE.TextureLoader();
        const loadedTextures = [];
        imagesList.forEach((src, idx) => {
            textureLoader.load(src, (texture) => {
                loadedTextures[idx] = texture;
            }, undefined, () => {
                loadedTextures[idx] = new THREE.Texture();
            });
        });

        // القلوب المتساقطة السريعة والكثيفة في البداية
        const heartsGroup = new THREE.Group();
        scene.add(heartsGroup);
        const heartShape = new THREE.Shape();
        heartShape.moveTo(25, 25);
        heartShape.bezierCurveTo(25, 25, 20, 0, 0, 0);
        heartShape.bezierCurveTo(-30, 0, -30, 35, -30, 35);
        heartShape.bezierCurveTo(-30, 55, -10, 77, 25, 95);
        heartShape.bezierCurveTo(60, 77, 80, 55, 80, 35);
        heartShape.bezierCurveTo(80, 35, 80, 0, 50, 0);
        heartShape.bezierCurveTo(35, 0, 25, 25, 25, 25);

        const extrudeSettings = { depth: 8, bevelEnabled: true, bevelSegments: 2, steps: 1, bevelSize: 2, bevelThickness: 2 };
        const heartGeo = new THREE.ExtrudeGeometry(heartShape, extrudeSettings);
        heartGeo.scale(0.018, 0.018, 0.018);
        heartGeo.center();

        const hearts = [];
        for (let i = 0; i < 90; i++) {
            const material = new THREE.MeshBasicMaterial({ color: 0xff69b4, transparent: true, opacity: 0.85 });
            const heart = new THREE.Mesh(heartGeo, material);
            heart.position.set((Math.random() - 0.5) * 35, (Math.random() - 0.5) * 35, (Math.random() - 0.5) * 20);
            heart.rotation.x = Math.PI;
            heartsGroup.add(heart);
            hearts.push(heart);
        }

        // تكوين القلب المتوهج الختامي مع الصور الحقيقية العشرة
        let photoMeshes = [];
        function createHeartCollage() {
            heartsGroup.visible = false; // إخفاء القلوب المتساقطة وإظهار قلب الصور
            imagesList.forEach((src, i) => {
                const geometry = new THREE.PlaneGeometry(2.5, 3.2);
                const material = new THREE.MeshBasicMaterial({ 
                    map: loadedTextures[i] || new THREE.Texture(), 
                    side: THREE.DoubleSide 
                });
                const mesh = new THREE.Mesh(geometry, material);
                
                // حساب إحداثيات شكل القلب هندسياً لتتوزع الصور بدقة عليه
                const angle = (i / imagesList.length) * Math.PI * 2;
                let tx = 16 * Math.pow(Math.sin(angle), 3) * 0.35;
                let ty = (13 * Math.cos(angle) - 5 * Math.cos(2*angle) - 2 * Math.cos(3*angle) - Math.cos(4*angle)) * 0.35;
                
                mesh.position.set(0, 0, -10);
                scene.add(mesh);
                photoMeshes.push(mesh);

                // حركة انسيابية لتتخذ الصور شكل القلب المتوهج
                gsap.to(mesh.position, {
                    x: tx,
                    y: ty,
                    z: 0,
                    duration: 2,
                    delay: i * 0.15,
                    ease: "power2.out"
                });
            });
        }

        // الانتقال للقلب المتوهج بالصور بعد 6 ثوانٍ
        setTimeout(() => {
            createHeartCollage();
        }, 6000);

        function animate() {
            requestAnimationFrame(animate);
            
            // تحريك القلوب المتساقطة بكثافة وسرعة
            hearts.forEach(h => {
                h.position.y -= 0.12;
                h.rotation.z += 0.02;
                if (h.position.y < -18) {
                    h.position.y = 18;
                    h.position.x = (Math.random() - 0.5) * 35;
                }
            });

            // نبض وتوهج طفيف لصور القلب الختامي
            if (photoMeshes.length > 0) {
                photoMeshes.forEach((mesh, idx) => {
                    mesh.rotation.z = Math.sin(Date.now() * 0.001 + idx) * 0.1;
                });
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
